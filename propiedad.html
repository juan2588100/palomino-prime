<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="propiedad.css">
</head>
<body>
    <main class="contenedor-principal">
        <!-- Título y Ubicación -->
        <header class="propiedad-header">
            <h1>CABAÑA FRENTE AL MAR</h1>
            <p>📍 Palomino, La Guajira</p>
        </header>

        <!-- Galería Moderna (Grid) -->
        <section class="galeria-grid">
            <img src="foto-grande.jpg" class="img-principal" alt="Vista Principal">
            <img src="foto2.jpg" class="img-secundaria" alt="Detalle 1">
            <img src="foto3.jpg" class="img-secundaria" alt="Detalle 2">
        </section>

        <div class="contenido-doble-columna">
            <!-- Columna Izquierda: Detalles -->
            <article>
                <h2>Acerca de esta propiedad</h2>
                <p>Descripción detallada aquí...</p>

                <!-- Características con íconos -->
                <div class="features-grid">
                    <div class="feature-card">🛏️ 3 Habitaciones</div>
                    <div class="feature-card">🚿 2 Baños</div>
                    <div class="feature-card">📐 150 m²</div>
                </div>

                <!-- Mapa embebido dinámico -->
                <div id="mapa-container">
                    <h3>Ubicación</h3>
                    <div class="map-placeholder">
                        <!-- Aquí irá el iframe con las coordenadas -->
                        <p>Mapa centrado en tus coordenadas guardadas.</p>
                    </div>
                </div>
            </article>

            <!-- Columna Derecha: Tarjeta de Precio (Sticky) -->
            <aside class="sticky-sidebar">
                <div class="tarjeta-reserva">
                    <h3>$180,000 USD</h3>
                    <p>$750,000,000 COP</p>
                    <button class="btn-primary">CONTACTAR ASESOR</button>
                </div>
            </aside>
        </div>
    </main>
</body>
</html>
